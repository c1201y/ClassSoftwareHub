name: Deploy to GitHub Pages & OpenList

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 只在这里构建一次，产物由后面三个上传任务共用。
  # （原先三个任务各自 npm ci + build:single，一次部署白构建两遍。）
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包单文件 HTML
        run: npm run build:single

      - name: 上传打包结果到 GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 上传打包结果（供 FTP / OpenList 复用）
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  upload-to-openlist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 取出构建产物
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: 只上传单文件 HTML 到 OpenList WebDAV
        # 单文件打包产物 dist/ 下只有 index.html（CSS/JS/图片全部内联），
        # 所以这里只传这一个 HTML，不再打包也不再整目录上传。
        # keep_structure 保持默认 false → 直接落到 /网站/index.html
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: "https://pan.132614.xyz/dav/"
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/网站/"
          files: ./dist/index.html
          fail_on_unmatched_files: true

  upload-to-ftp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 取出构建产物
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: 上传单文件站点到 FTP 服务器
        # 单文件打包产物 dist/ 下只有 index.html（CSS/JS/图片全部内联），
        # 直接把 dist/ 目录镜像到 FTP 根目录即可。
        # 凭据全部通过仓库 Secrets 注入：FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
        # ⚠️ 本仓库是公开仓库，任何凭据都不要明文写进本文件（含注释）——
        #    写进来等于公开，且进入 git 历史后无法撤回，只能改密码。
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: /
