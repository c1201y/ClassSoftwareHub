name: Deploy to GitHub Pages & OpenList

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包单文件 HTML
        run: npm run build:single

      - name: 上传打包结果到 GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  upload-to-openlist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./dist

      - name: 只上传单文件 HTML 到 OpenList WebDAV
        # 单文件打包产物 dist/ 下只有 index.html（CSS/JS/图片全部内联），
        # 所以这里只传这一个 HTML，不再打包也不再整目录上传。
        # keep_structure 保持默认 false → 直接落到 /网站/index.html
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: "https://pan.132614.xyz/dav/"
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/网站/"
          files: ./dist/index.html
          fail_on_unmatched_files: true