name: 部署站点（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # ⚠️ 必须 false（GitHub 官方 Pages 模板也是 false）：
  #    本工作流除了 push 之外还会被 check-updates.yml / review-submission.yml 主动派发，
  #    两处接连派发是常态，用 true 就等于给「发布到一半被掐掉」留了后门。
  #    false 时新来的那一次只是排队（GitHub 只保留 1 个 running + 1 个 pending，
  #    更新的 pending 会顶掉旧的 pending），永远不会打断正在进行的发布。
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包站点（多文件：index.html + assets/）
        # 以前是 npm run build:single —— 整站塞进一个约 2 MB 的 HTML，每次打开都全量重下。
        # 现在走普通多文件构建：assets/ 按路由分包、文件名带内容 hash，首屏只下当前页
        # 需要的几个文件，重复访问直接命中缓存。
        run: npm run build

      - name: 上传打包结果到 GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 上传打包结果（供 publish-ecs-branch 复用）
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  # 把同一份构建产物再发布到独立的 deploy-ecs 分支。
  # ECS（国内入口）用定时器只读拉取这个分支：不需要任何 SSH 凭据，
  # 也不需要在这台 1.6 GB 的小机器上装 Node 去构建。
  publish-ecs-branch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出构建产物
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: 发布 dist/ 到 deploy-ecs 分支（每次单提交，强制覆盖）
        # 只保留一条提交：Force push 后分支体积恒定，ECS 的 `--depth 1` 拉取也快。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/deploy-ecs


  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    # 站点发完之后再通知搜索引擎，否则引擎来抓时可能还是旧页面。
    # 这一步永远不失败（脚本内部把一切异常都降级成 warning）：IndexNow 只是
    # 「让重抓快一点」的加速器，挂了不该把一次成功的部署染色。
    needs: [deploy-github-pages]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 取出源码
        # scripts/indexnow.mjs 与 public/<key>.txt 都在仓库里，这一步不能省。
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 通知 Bing / Yandex 等 IndexNow 引擎（本站只有首页可提交，见 AGENTS.md）
        run: node scripts/indexnow.mjs
