name: Deploy to GitHub Pages & OpenList

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 只在这里构建一次，产物由后面三个上传任务共用。
  # （原先三个任务各自 npm ci + build:single，一次部署白构建两遍。）
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包单文件 HTML
        run: npm run build:single

      - name: 上传打包结果到 GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 上传打包结果（供 FTP / OpenList 复用）
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  upload-to-openlist:
    needs: build
    runs-on: ubuntu-latest
    # 网盘（OpenList WebDAV）偶发抖动会导致连接超时 —— 这一路失败只标黄警告，
    # 不让整次部署变红（站点主入口同时走 GitHub Pages 与 FTP，不受影响）。
    continue-on-error: true
    steps:
      - name: 取出构建产物
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: 只上传单文件 HTML 到 OpenList WebDAV（失败自动重试 3 次）
        # 单文件打包产物 dist/ 下只有 index.html（CSS/JS/图片全部内联），
        # 所以这里只传这一个 HTML，不再打包也不再整目录上传。
        # 目标：https://pan.132614.xyz/dav/网站/index.html（%E7%BD%91%E7%AB%99 就是「网站」）。
        # 这里不用现成 action 而是手写 curl：那个 action 没设连接超时，网络抖动时要白等 2 分多
        # 才报 ETIMEDOUT；curl 30 秒即可判定失败，随后退避重试，整体更快也更稳。
        env:
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          set -u
          target='https://pan.132614.xyz/dav/%E7%BD%91%E7%AB%99/index.html'
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次上传"
            if curl -fsS --connect-timeout 30 --max-time 180 \
                 -T ./dist/index.html \
                 --user "${WEBDAV_USERNAME}:${WEBDAV_PASSWORD}" \
                 "$target"; then
              echo "上传成功"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::第 ${attempt} 次上传失败"
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "等待 ${delay}s 后重试"
              sleep "$delay"
            fi
          done
          echo "::error::3 次上传均失败 —— 网盘这一路已跳过，站点主入口（Pages / FTP）不受影响"
          exit 1

  upload-to-ftp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 取出构建产物
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: 上传单文件站点到 FTP 服务器
        # 单文件打包产物 dist/ 下只有 index.html（CSS/JS/图片全部内联），
        # 直接把 dist/ 目录镜像到 FTP 根目录即可。
        # 凭据全部通过仓库 Secrets 注入：FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
        # ⚠️ 本仓库是公开仓库，任何凭据都不要明文写进本文件（含注释）——
        #    写进来等于公开，且进入 git 历史后无法撤回，只能改密码。
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: /
