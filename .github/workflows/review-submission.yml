name: Review Submission

on:
  issues:
    types: [labeled]

jobs:
  review:
    if: |
      (github.event.label.name == 'approved' || github.event.label.name == 'rejected')
      && contains(github.event.issue.labels.*.name, '待审核')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 处理审核结果
        uses: actions/github-script@v7
        env:
          LABEL: ${{ github.event.label.name }}
        with:
          script: |
            const fs = require('fs')
            const label = process.env.LABEL
            const issue = context.payload.issue
            const body = issue.body || ''
            const match = body.match(/\*\*提交文件\*\*：`([^`]+)`/)
            if (!match) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '❌ 无法找到提交文件路径。'
              })
              return
            }
            const submissionPath = match[1]

            if (!fs.existsSync(submissionPath)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件不存在：\`${submissionPath}\``
              })
              return
            }

            const data = JSON.parse(fs.readFileSync(submissionPath, 'utf8'))
            const appsPath = `软件数据/apps/${data.id}.json`

            if (label === 'approved') {
              if (fs.existsSync(appsPath)) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `❌ 已存在同名文件 \`${appsPath}\`。请先删除旧文件或让提交者改 ID 后重新提交。`
                })
                return
              }
              const clean = { ...data }
              delete clean['_提交时间']
              delete clean['_原始ID冲突']
              fs.writeFileSync(appsPath, JSON.stringify(clean, null, 2))
              fs.unlinkSync(submissionPath)

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `✅ 已合并到 \`${appsPath}\`，稍后自动构建上线。`
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            } else if (label === 'rejected') {
              fs.unlinkSync(submissionPath)
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '🗑️ 已删除草稿文件，Issue 关闭。'
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            }

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "review: ${{ github.event.label.name }} #${{ github.event.issue.number }}"
          git push