name: Review Submission

on:
  issues:
    types: [labeled]

jobs:
  review:
    if: |
      (github.event.label.name == 'approved' || github.event.label.name == 'rejected')
      && contains(github.event.issue.labels.*.name, '待审核')
    runs-on: ubuntu-latest
    # 批量审核（UI 里勾选多个 Issue 一起打标签）会同时触发多个运行，它们从同一
    # HEAD 各自 commit，谁先 push 成功谁赢，其余全部 non-fast-forward 失败
    # （实测 2026-09-15 10:37 连续两次审核各挂一次，那次审核操作等于丢了）。
    # 用 queue:max 让它们排队串行执行（最多 100 个在队里）。
    # ⚠️ 不能拿 cancel-in-progress:false 代替 —— 那不是排队：并发组默认只保留
    #    1 running + 1 pending，新来的 pending 会把旧的【顶掉】，批量审核会静默丢单。
    concurrency:
      group: review-submission
      queue: max
    permissions:
      contents: write
      issues: write
      # 需要 actions:write 才能派发 deploy.yml（见下方「触发构建与部署」）
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 处理审核结果
        uses: actions/github-script@v7
        env:
          LABEL: ${{ github.event.label.name }}
        with:
          script: |
            const fs = require('fs')
            const label = process.env.LABEL
            const issue = context.payload.issue
            const body = issue.body || ''
            const match = body.match(/\*\*提交文件\*\*：`([^`]+)`/)
            if (!match) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '❌ 无法找到提交文件路径。'
              })
              return
            }
            const submissionPath = match[1]

            if (!fs.existsSync(submissionPath)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件不存在：\`${submissionPath}\``
              })
              return
            }

            const data = JSON.parse(fs.readFileSync(submissionPath, 'utf8'))
            const appsPath = `软件数据/apps/${data.id}.json`

            if (label === 'approved') {
              if (fs.existsSync(appsPath)) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `❌ 已存在同名文件 \`${appsPath}\`。请先删除旧文件或让提交者改 ID 后重新提交。`
                })
                return
              }
              const clean = { ...data }
              delete clean['_提交时间']
              delete clean['_原始ID冲突']
              fs.writeFileSync(appsPath, JSON.stringify(clean, null, 2))
              fs.unlinkSync(submissionPath)

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `✅ 已合并到 \`${appsPath}\`，稍后自动构建上线。`
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            } else if (label === 'rejected') {
              fs.unlinkSync(submissionPath)
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '🗑️ 已删除草稿文件，Issue 关闭。'
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            }

      - name: 提交更改
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "review: ${{ github.event.label.name }} #${{ github.event.issue.number }}"
            # 兜底：万一仍有并发（队列未生效等），反复 rebase 到最新 main 重试
            ok=""
            for i in $(seq 1 8); do
              if git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              git pull --rebase origin main || true
              sleep $((RANDOM % 3 + 1))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::推送失败（多次重试后仍冲突），请重新给该 Issue 打一次标签。"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发构建与部署
        # ⚠️ 用 GITHUB_TOKEN 推送产生的 push 事件【不会】触发其它工作流（GitHub 防递归机制），
        #    所以审核合并后 deploy.yml 不会自己跑，必须在这里显式派发一次。
        #    workflow_dispatch 是这条限制的唯一例外，但仍需 GITHUB_TOKEN 具备 actions:write。
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main