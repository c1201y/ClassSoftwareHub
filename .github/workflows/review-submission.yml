name: 审核软件提交

on:
  issues:
    types: [labeled]

jobs:
  review:
    if: |
      (github.event.label.name == 'approved' || github.event.label.name == 'rejected'
       || github.event.label.name == '覆盖已存在' || github.event.label.name == 'overwrite')
      && contains(github.event.issue.labels.*.name, '待审核')
    runs-on: ubuntu-latest
    # 批量审核（UI 里勾选多个 Issue 一起打标签）会同时触发多个运行，它们从同一
    # HEAD 各自 commit，谁先 push 成功谁赢，其余全部 non-fast-forward 失败
    # （实测 2026-09-15 10:37 连续两次审核各挂一次，那次审核操作等于丢了）。
    # 用 queue:max 让它们排队串行执行（最多 100 个在队里）。
    # ⚠️ 不能拿 cancel-in-progress:false 代替 —— 那不是排队：并发组默认只保留
    #    1 running + 1 pending，新来的 pending 会把旧的【顶掉】，批量审核会静默丢单。
    concurrency:
      group: review-submission
      queue: max
    permissions:
      contents: write
      issues: write
      # 需要 actions:write 才能派发 deploy.yml（见下方「触发构建与部署」）
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 处理审核结果
        uses: actions/github-script@v7
        env:
          LABEL: ${{ github.event.label.name }}
        with:
          script: |
            const fs = require('fs')
            const label = process.env.LABEL
            const issue = context.payload.issue
            const body = issue.body || ''
            const match = body.match(/\*\*提交文件\*\*：`([^`]+)`/)
            if (!match) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '❌ 无法找到提交文件路径。'
              })
              return
            }
            const submissionPath = match[1]

            // 只允许操作 submissions/ 下的草稿：Issue 正文里有一部分是外部可控文本，
            // 万一被伪造成别的路径，绝不能让这一步写到 软件数据/ 或仓库外。
            if (!submissionPath.startsWith('submissions/') || submissionPath.includes('..')) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件路径不合法：\`${submissionPath}\``
              })
              return
            }

            if (!fs.existsSync(submissionPath)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件不存在：\`${submissionPath}\``
              })
              return
            }

            const data = JSON.parse(fs.readFileSync(submissionPath, 'utf8'))
            const appsPath = `软件数据/apps/${data.id}.json`

            // ── 幂等保护：确认这条草稿还没被本轮（或既往）的审核消费掉 ──
            // ⚠️ 同一个 Issue 被**连续打两个标签**时（例如先 `approved`、又想改成
            //    `覆盖已存在`），GitHub 会对每个标签各派发一次运行。`concurrency: queue:max`
            //    只让它们**排队串行**，并不阻止第二个运行 —— 第一次已经 unlink 了草稿、
            //    关掉了 Issue，第二次跑起来草稿已不在，于是给维护者回一句
            //    「❌ 提交文件不存在」的假报错，看着像操作失败（实际数据是对的）。
            //    判据取「草稿是否还在 + 是否已关」两者之一命中就静默收工：
            //      · 草稿没了 ⇒ 上一次运行已经把它合并 / 删除，本轮无事可做；
            //      · Issue 已关闭 ⇒ 上一次运行已经把它关掉，本轮不再重复评论。
            //    这里对 `rejected` 同样适用（删草稿 + 关 Issue）。
            if (issue.state === 'closed') {
              core.info(`Issue #${issue.number} 已是关闭状态（多半是上一个标签的运行处理过了），本轮跳过`)
              return
            }

            // 覆盖通道（2026-09-20 新增）：ID 冲突时默认拒绝，但维护者有时确实想用本次提交
            // 替换站内那份（例如提交者后来补了更全的信息）。打「覆盖已存在」才放行。
            // ⚠️ 覆盖是**整份替换**：图标 / 版本号 / 下载直链全部以本次提交为准，代价必须看得见
            //    —— 评论里会自动贴出「字段级差异」+「旧版完整内容」，且旧版永远能从本次提交的
            //    父提交找回：`git show <父提交>:软件数据/apps/<id>.json`。
            const OVERWRITE_LABEL = '覆盖已存在'
            const isOverwrite = label === OVERWRITE_LABEL || label === 'overwrite'
            const clip = (v) => {
              const one = String(typeof v === 'string' ? v : JSON.stringify(v ?? null))
                .replace(/\|/g, '\\|').replace(/\s+/g, ' ')
              return one.length > 72 ? one.slice(0, 72) + '…' : one
            }
            const diffTable = (oldD, newD) => {
              const rows = []
              for (const k of [...new Set([...Object.keys(oldD), ...Object.keys(newD)])].sort()) {
                if (k === 'downloads') continue
                if (JSON.stringify(oldD[k] ?? null) !== JSON.stringify(newD[k] ?? null)) {
                  rows.push(`| \`${k}\` | ${clip(oldD[k])} | ${clip(newD[k])} |`)
                }
              }
              const od = Array.isArray(oldD.downloads) ? oldD.downloads : []
              const nd = Array.isArray(newD.downloads) ? newD.downloads : []
              if (JSON.stringify(od) !== JSON.stringify(nd)) {
                rows.push(`| \`downloads\` | ${od.length} 条 | ${nd.length} 条 |`)
              }
              if (!rows.length) return '> 覆盖前后内容完全一致（等于空操作）。'
              return ['**覆盖前 → 覆盖后**', '', '| 字段 | 旧 | 新 |', '|---|---|---|', ...rows].join('\n')
            }

            if (label === 'approved' || isOverwrite) {
              const exists = fs.existsSync(appsPath)
              if (exists && !isOverwrite) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `❌ 已存在同名文件 \`${appsPath}\`。请先删除旧文件或让提交者改 ID 后重新提交。\n\n`
                    + `> 若确实要用**本次提交**整份覆盖站内那份，请改打 \`${OVERWRITE_LABEL}\` 标签`
                    + `（图标 / 版本号 / 下载直链都会以本次提交为准；旧内容会自动附在本 Issue 评论里）。`
                })
                return
              }
              // 覆盖前先把旧版整份读出来留档，避免「黑箱覆盖」
              let oldData = null
              if (exists) {
                try {
                  oldData = JSON.parse(fs.readFileSync(appsPath, 'utf8'))
                } catch (e) {
                  oldData = null
                }
              }
              // 合并前剥掉所有「审核用元数据」字段：一律以 `_` 开头
              // （`_提交时间` / `_原始ID冲突` / `_联系方式`……），它们只服务于审核环节，
              // 不属于站点数据契约（字段表见 软件数据/README-维护手册.md）。
              // 按前缀过滤而不是逐个列举，是为了以后加字段不用再回来改这里。
              const clean = { ...data }
              for (const key of Object.keys(clean)) {
                if (key.startsWith('_')) delete clean[key]
              }
              fs.writeFileSync(appsPath, JSON.stringify(clean, null, 2))
              fs.unlinkSync(submissionPath)

              let tail = ''
              if (oldData) {
                tail = '\n\n' + diffTable(oldData, clean)
                  + '\n\n<details><summary>旧版完整内容（覆盖前存档）</summary>\n\n```json\n'
                  + JSON.stringify(oldData, null, 2)
                  + '\n```\n\n</details>'
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `✅ 已${exists ? '覆盖' : '合并到'} \`${appsPath}\`，稍后自动构建上线。` + tail
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            } else if (label === 'rejected') {
              fs.unlinkSync(submissionPath)
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '🗑️ 已删除草稿文件，Issue 关闭。'
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            }

      - name: 提交更改
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "review: ${{ github.event.label.name }} #${{ github.event.issue.number }}"
            # 兜底：万一仍有并发（队列未生效等），反复 rebase 到最新 main 重试
            ok=""
            for i in $(seq 1 8); do
              if git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              git pull --rebase origin main || true
              sleep $((RANDOM % 3 + 1))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::推送失败（多次重试后仍冲突），请重新给该 Issue 打一次标签。"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发构建与部署
        # ⚠️ 用 GITHUB_TOKEN 推送产生的 push 事件【不会】触发其它工作流（GitHub 防递归机制），
        #    所以审核合并后 deploy.yml 不会自己跑，必须在这里显式派发一次。
        #    workflow_dispatch 是这条限制的唯一例外，但仍需 GITHUB_TOKEN 具备 actions:write。
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main