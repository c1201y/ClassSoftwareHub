name: 审核软件提交

on:
  issues:
    types: [labeled]

jobs:
  review:
    if: |
      (github.event.label.name == 'approved' || github.event.label.name == 'rejected'
       || github.event.label.name == '覆盖已存在' || github.event.label.name == 'overwrite')
      && contains(github.event.issue.labels.*.name, '待审核')
    runs-on: ubuntu-latest
    # 批量审核（UI 里勾选多个 Issue 一起打标签）会同时触发多个运行，它们从同一
    # HEAD 各自 commit，谁先 push 成功谁赢，其余全部 non-fast-forward 失败
    # （实测 2026-09-15 10:37 连续两次审核各挂一次，那次审核操作等于丢了）。
    # 用 queue:max 让它们排队串行执行（最多 100 个在队里）。
    # ⚠️ 不能拿 cancel-in-progress:false 代替 —— 那不是排队：并发组默认只保留
    #    1 running + 1 pending，新来的 pending 会把旧的【顶掉】，批量审核会静默丢单。
    concurrency:
      # 统一数据写入组（见 create-review-issue.yml 顶上的注释）：审核合并与
      # 「开 Issue 后收草稿」都会 push main，以前各占一个组、可能同时跑。
      group: repo-data-write
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ issues 事件的 github.sha 被钉在「事件发生那一刻」的 main 上：一次性勾选多条
      #    Issue 打标签时，几个运行会 checkout 到同一个旧提交（实测 2026-10-04 09:47 的
      #    四个运行全部停在 17952205）。它们各自算出同一个「下一个编号」，先推的赢，
      #    其余在 push 时撞 add/add 冲突，重试也永远解不开 —— 投稿就这么无声丢掉了。
      #    这里先对齐到真正的 main 最新；配合上面的 queue:max 串行，编号才互不重复。
      - name: 同步到最新 main
        run: |
          git fetch --no-tags origin main
          git reset --hard origin/main

      - name: 处理审核结果
        uses: actions/github-script@v7
        env:
          LABEL: ${{ github.event.label.name }}
          # 审核不通过时用它把桶里的对象一并删掉；未配置则跳过清理（只告警，不阻断审核）
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
          # ⚠️ 用 Cloudflare 直连入口，不要用 cshapi（那条走 SpeedOnline CDN 回源，
          #    2026-10-05 起持续 502）。这条链路挂着「不通过清桶 / 通过后迁移到 releases/ /
          #    推送后清源」三件事，而且设计上**只告警不阻断** —— 也就是说它挂了不会报错，
          #    只会静默地一个对象也不清，桶里的孤儿就这么攒着。所以入口必须挑稳的那条。
          PURGE_BASE: https://submit.132614.xyz
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            // 把「推送成功后该删哪些源对象」写在这里，交给后面的独立步骤执行。
            // 不直接在 github-script 里删：那时候还没推送，删了就是把还在被引用的对象干掉。
            const MOVE_PLAN = path.join(process.env.RUNNER_TEMP || '/tmp', 'oss-move-plan.json')
            // 让 GitHub 把这个值在此后所有日志里涂成 ***（github-script 里没有 ::add-mask::，
            // core.setSecret 等价）。这条链路里 token 只作为请求头发出去、从不打印 ——
            // 这一层纯粹是防着将来有人加调试输出。
            if (process.env.PURGE_TOKEN) core.setSecret(process.env.PURGE_TOKEN)
            const label = process.env.LABEL
            const issue = context.payload.issue
            const body = issue.body || ''
            const match = body.match(/\*\*提交文件\*\*：`([^`]+)`/)
            if (!match) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '❌ 无法找到提交文件路径。'
              })
              return
            }
            const submissionPath = match[1]

            // 只允许操作 submissions/ 下的草稿：Issue 正文里有一部分是外部可控文本，
            // 万一被伪造成别的路径，绝不能让这一步写到 软件数据/ 或仓库外。
            // 用 resolve 之后做包含性判断（比字符串 startsWith 更难绕过：`submissions/../x`、
            // 绝对路径、Windows 反斜杠都由它一并挡住）。
            const stage = process.cwd()
            const subsDir = path.resolve(stage, 'submissions')
            const resolved = path.resolve(stage, submissionPath)
            if (resolved !== subsDir && !resolved.startsWith(subsDir + path.sep)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件路径不合法：\`${submissionPath}\``
              })
              return
            }

            // 草稿不在 = 上一次运行已经把它消费掉了（连打两个标签、或同一批次重跑）。
            // ⚠️ 判据要取 Issue 的**实时**状态：标签事件 payload 里的 state 是事件发生
            //    那一刻的快照，两个标签几乎同时打上时它仍写着 open，据此回一句
            //    「提交文件不存在」就是假报错。
            if (!fs.existsSync(submissionPath)) {
              const fresh = await github.rest.issues.get({
                ...context.repo,
                issue_number: issue.number
              })
              if (fresh.data.state === 'closed') {
                core.info(`草稿已被上一次运行消费，Issue #${issue.number} 已关闭，本轮静默收工`)
                return
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件不存在：\`${submissionPath}\``
              })
              return
            }

            // ⚠️ 草稿内容**整份**由提交者决定，`data.id` 也是 —— 而它会被拼成写入路径。
            //    `"id": "../../package"` 会覆盖仓库根目录的 package.json，换成 `../../package-lock`
            //    就能让 CI 的 `npm ci` 跑攻击者给的依赖图。所以这里必须自己校验，不能指望上游
            //    （SubmitPage.vue 的 buildPayload 只是 trim()）。
            //    判据与 scripts/update-ignore.mjs、SubmitPage.vue 的 ID_PATTERN 一致。
            const ID_RE = /^[a-z0-9][a-z0-9-]*$/
            const appsDir = path.resolve(stage, '软件数据', 'apps')

            let data
            try {
              data = JSON.parse(fs.readFileSync(submissionPath, 'utf8'))
            } catch (e) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件不是合法 JSON：\`${submissionPath}\``
              })
              return
            }
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交文件的内容不是一个软件对象（顶层必须是 JSON 对象）：\`${submissionPath}\``
              })
              return
            }

            // ── 反馈：不归这条管道管 ──
            // 反馈草稿在 create-review-issue.yml 里「开完 Issue 即收起」，正常根本不会流到
            // 这里。万一残留（收起那步推送失败）或有人给反馈 Issue 也打了「待审核」，
            // 这里直接说清楚就收工 —— 反馈没有要合并进仓库的数据文件。
            if (data._类型 === '反馈') {
              core.info('反馈草稿：无需合并，本步骤收工')
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: 'ℹ️ 这是一条**反馈**：Issue 本身就是它的归宿，没有需要合并进仓库的数据文件。\n\n'
                  + '直接在 Issue 里回复跟进、处理完关闭即可。'
              })
              return
            }

            // ── 回声洞字条：同一条审核管道，落地目标是 回声洞/messages/messageN.json ──
            // 草稿来自 classhub worker 的 /api/echocave，形如
            // `{ "_类型": "回声洞", "text": "…", "_提交时间": "…" }`（没有 id / name 等软件字段）。
            // 必须在下面的软件字段校验之前分流，否则会被当成「id 不是非空字符串」拒掉。
            if (data._类型 === '回声洞') {
              const echoText = String(data.text ?? '').trim()
              if (!echoText) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: '❌ 这条回声洞投稿没有正文（`text` 为空）。'
                })
                return
              }
              if (echoText.length > 200) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `❌ 这条回声洞投稿超长（${echoText.length} 字，上限 200 字）。`
                })
                return
              }
              // 目标目录固定 回声洞/messages：路径由代码给定，不取自草稿内容，天然不可越界
              const echoDir = path.resolve(stage, '回声洞', 'messages')
              const approveEcho = label === 'approved' || label === '覆盖已存在' || label === 'overwrite'
              if (approveEcho) {
                // 取现有最大编号 + 1。编号一旦用过就不再复用（见 回声洞/README.md），
                // 这样网页端、桌面端、CSHcontroller 按文件名排序的口径始终一致。
                let echoMax = 0
                if (fs.existsSync(echoDir)) {
                  for (const f of fs.readdirSync(echoDir)) {
                    const m = /^message(\d+)\.json$/i.exec(f)
                    if (m) echoMax = Math.max(echoMax, Number(m[1]))
                  }
                }
                const echoName = `message${echoMax + 1}.json`
                fs.mkdirSync(echoDir, { recursive: true })
                fs.writeFileSync(path.join(echoDir, echoName), JSON.stringify({ text: echoText }, null, 2) + '\n')
                fs.unlinkSync(submissionPath)
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `✅ 已收进 \`回声洞/messages/${echoName}\`，稍后自动构建上线。`
                })
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: 'closed'
                })
              } else if (label === 'rejected') {
                fs.unlinkSync(submissionPath)
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: '🗑️ 已删除回声洞投稿，Issue 关闭。'
                })
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: 'closed'
                })
              }
              return
            }

            if (typeof data.id !== 'string' || !data.id) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交里的 \`id\` 不是非空字符串：\`${JSON.stringify(data.id)}\``
              })
              return
            }

            const appsPath = path.join(appsDir, `${data.id}.json`)
            // 评论里给维护者看的永远是仓库相对路径（appsPath 是 runner 上的绝对路径）
            const appsDisplay = `软件数据/apps/${data.id}.json`
            // ① 路径包含性：dirname 与 appsDir 相等 ⇒ id 里没有任何路径分隔符（`..`/`/` 都不可能）
            const contained = path.dirname(appsPath) === appsDir
            // ② 字符集：新 ID 按约定卡死；**目标文件已存在**时额外放行 ——
            //    站内历史上有 5 个不合规的 ID（`WPS` / `Supermium` / `bandizip6.29` …），
            //    若一律拒绝，打「覆盖已存在」就再也修不了它们了。
            //    这条放行不构成风险：写入目标是一个**已经存在**的单段文件名，不可能跑到别处。
            const conforming = ID_RE.test(data.id)
            // ② 的 legacy 放行也要有下限：大小写字母/数字/点/下划线/短横线，且不能以点开头。
            // 「目标文件恰好存在」只豁免命名**约定**（历史上那 5 个大写 ID），不豁免字符集 ——
            // 不然空格、控制字符、结尾的点之类的怪名字也能借覆盖通道写进仓库文件名。
            const LEGACY_ID_RE = /^[A-Za-z0-9][A-Za-z0-9._-]*$/
            const legacyExisting =
              !conforming && LEGACY_ID_RE.test(data.id) && fs.existsSync(appsPath)
            if (!contained || !(conforming || legacyExisting)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `❌ 提交里的 \`id\` 不合法：\`${JSON.stringify(data.id)}\`\n\n`
                  + '> 只允许**小写字母、数字、短横线**，且不能以短横线开头（例：`classisland`、`7-zip`）。'
                  + '请让提交者改 ID 后重新提交。'
              })
              return
            }
            if (legacyExisting) {
              core.warning(`id \`${data.id}\` 不符合命名约定，但因为目标文件已存在（属覆盖通道），予以放行`)
            }

            // ── 幂等 ──
            // 同一个 Issue 被**连续打两个标签**时（例如先 `approved`、又想改成
            // `覆盖已存在`），GitHub 会对每个标签各派发一次运行；第二次跑起来草稿已经
            // 被第一次 unlink 掉了，上面「草稿不存在」那一步会按**实时** Issue 状态静默
            // 收工，不会再回一句假的「提交文件不存在」。
            // ⚠️ 这里刻意**不再**用 `issue.state === 'closed'` 提前 return：上一次运行在
            //    push 阶段失败时（2026-10-04 回声洞批量审核就这么丢了 3 条），Issue 已经
            //    被关掉、草稿却还在 —— 那种情况必须继续处理，维护者重打一次标签就能补回来。

            // 覆盖通道（2026-09-20 新增）：ID 冲突时默认拒绝，但维护者有时确实想用本次提交
            // 替换站内那份（例如提交者后来补了更全的信息）。打「覆盖已存在」才放行。
            // ⚠️ 覆盖是**整份替换**：图标 / 版本号 / 下载直链全部以本次提交为准，代价必须看得见
            //    —— 评论里会自动贴出「字段级差异」+「旧版完整内容」，且旧版永远能从本次提交的
            //    父提交找回：`git show <父提交>:软件数据/apps/<id>.json`。
            const OVERWRITE_LABEL = '覆盖已存在'
            const isOverwrite = label === OVERWRITE_LABEL || label === 'overwrite'
            const clip = (v) => {
              const one = String(typeof v === 'string' ? v : JSON.stringify(v ?? null))
                .replace(/\|/g, '\\|').replace(/\s+/g, ' ')
              return one.length > 72 ? one.slice(0, 72) + '…' : one
            }
            const diffTable = (oldD, newD) => {
              const rows = []
              for (const k of [...new Set([...Object.keys(oldD), ...Object.keys(newD)])].sort()) {
                if (k === 'downloads') continue
                if (JSON.stringify(oldD[k] ?? null) !== JSON.stringify(newD[k] ?? null)) {
                  rows.push(`| \`${k}\` | ${clip(oldD[k])} | ${clip(newD[k])} |`)
                }
              }
              const od = Array.isArray(oldD.downloads) ? oldD.downloads : []
              const nd = Array.isArray(newD.downloads) ? newD.downloads : []
              if (JSON.stringify(od) !== JSON.stringify(nd)) {
                rows.push(`| \`downloads\` | ${od.length} 条 | ${nd.length} 条 |`)
              }
              if (!rows.length) return '> 覆盖前后内容完全一致（等于空操作）。'
              return ['**覆盖前 → 覆盖后**', '', '| 字段 | 旧 | 新 |', '|---|---|---|', ...rows].join('\n')
            }

            // ── 桶对象清理 ──────────────────────────────────────────────
            // 投稿里的软件包/图标现已直传阿里云 OSS（私有桶），审核不通过时草稿文件删了，
            // 桶里那份还在 —— 留着只是白付存储、白占一个能被换票取走的对象。所以拒绝时
            // 要连桶里的一起删。
            // 数据里本站对象只有两种写法（与前端 src/gallery/ossDownload.ts 一致）：
            //   oss://upload/…                       软件包
            //   https://<域名>/api/icon?k=icon/…     图标
            // 只认这两种；网盘 / 官网直链不是我们的对象，绝不能去删。
            const ossKeyOfUrl = (url) => {
              const raw = String(url ?? '').trim()
              if (!raw) return ''
              const m = /^oss:\/\/(.+)$/i.exec(raw)
              if (m) {
                try {
                  return decodeURIComponent(m[1].split(/[?#]/)[0].replace(/^\/+/, ''))
                } catch {
                  // 键里有不合法的 % 序列 —— 按「不是我们的对象」处理，
                  // 别让解码异常把整场审核炸掉（decodeURIComponent 会直接 throw）
                  return ''
                }
              }
              try {
                const u = new URL(raw)
                if (u.pathname === '/api/icon' || u.pathname === '/api/dl') {
                  return u.searchParams.get('k') || ''
                }
              } catch {
                // 不是合法 URL，按「不是我们的对象」处理
              }
              return ''
            }

            /**
             * 托管目录白名单：提交数据里能引用到的桶对象，只可能在这四个前缀之下。
             * 投稿数据是不可信输入 —— 上面 ossKeyOfUrl 只负责「认出这是不是我们的写法」，
             * 这里再卡一道「认出来的键是不是在托管目录里」，否则一份精心构造的提交
             * 可以让 purge/迁移去碰 gh-mirror/、registry 索引等根本不该投稿碰的东西
             * （Worker 端还有一层同样的白名单，这里是工作流侧的双保险）。
             */
            const MANAGED_KEY_RE = /^(?:upload|icon|releases|soft)\//
            const managedKeys = (keys) =>
              [...new Set((keys || []).filter((k) => k && MANAGED_KEY_RE.test(k) && !k.split('/').includes('..')))]

            /** 一份提交引用到的所有桶对象键（图标 + 各下载项），去重 + 白名单过滤后返回 */
            const collectOssKeys = (d) => {
              const keys = [ossKeyOfUrl(d?.icon)]
              for (const item of Array.isArray(d?.downloads) ? d.downloads : []) {
                keys.push(ossKeyOfUrl(item?.url))
              }
              return managedKeys(keys)
            }

            /**
             * 逐个调 Worker 的 /api/purge 删除；失败只告警，绝不拖垮审核本身。
             * options.requireRegistry —— 让 Worker 先查登记表，键不在表里就拒删。
             * 拒绝路径必须带上：投稿数据是不可信输入，万一引用了别人正在用的对象，
             * 维护者顺手打 rejected 就不该把别人的文件删掉（Worker 端 400，这里降级为告警）。
             */
            const purgeKeys = async (keys, options = {}) => {
              const unique = [...new Set((keys || []).filter(Boolean))]
              if (!unique.length) return []
              const token = process.env.PURGE_TOKEN
              if (!token) {
                core.warning(`未配置 PURGE_TOKEN，跳过 ${unique.length} 个桶对象的清理`)
                return []
              }
              const done = []
              for (const key of unique) {
                try {
                  const res = await fetch(`${process.env.PURGE_BASE}/api/purge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Purge-Token': token },
                    body: JSON.stringify(options.requireRegistry ? { key, requireRegistry: true } : { key })
                  })
                  if (res.ok) done.push(key)
                  else core.warning(`清理失败（HTTP ${res.status}）：${key}`)
                } catch (e) {
                  core.warning(`清理异常：${key}（${e && e.message}）`)
                }
              }
              return done
            }

            /**
             * 探一条外链是否还活着。
             *   true  = 明确回了 2xx/3xx；
             *   false = 明确回了 4xx/5xx（死链）；
             *   null  = 探不出结论（超时 / DNS / TLS 出错）——**不能被当成死链**，
             *           一次网络抖动就判人死链，比漏判更糟。
             * 先发 HEAD；有些站点明确不爱 HEAD（405 / 501）或对 HEAD 直接 403，
             * 这时回退到 GET + Range: bytes=0-0 —— 只要状态码，绝不把整个安装包拉下来。
             */
            const probeUrl = async (url) => {
              const opts = { redirect: 'follow', signal: AbortSignal.timeout(12000) }
              try {
                let res = await fetch(url, { ...opts, method: 'HEAD' })
                if (res.status === 400 || res.status === 403 || res.status === 405 || res.status === 501) {
                  res = await fetch(url, { ...opts, method: 'GET', headers: { Range: 'bytes=0-0' } })
                }
                return res.status >= 200 && res.status < 400
              } catch {
                return null
              }
            }

            /**
             * 上线前扫一遍这份提交里的**外部**下载直链，返回明确探到死链的那些。
             *
             * 为什么值得做：用户填的官网 / GitHub Release / 网盘直链，可能在排队审核的
             * 这几天里被作者删掉或改了名。审核通过那一刻没人再点一遍的话，站点上就多了
             * 一条「点开就 404」的条目。（本站对象不走这里：它们在迁移那一步就知道在不在。）
             *
             * ⚠️ **不阻断审核**，只把结论写进 Issue 评论由人判断：大量正经站点会拒 HEAD、
             *    或者要先鉴权再 302，硬拦会把好投稿挡在门外。
             */
            const checkExternalLinks = async (d) => {
              const urls = []
              for (const item of Array.isArray(d && d.downloads) ? d.downloads : []) {
                const u = String((item && item.url) || '')
                if (!u || ossKeyOfUrl(u)) continue
                if (!/^https?:\/\//i.test(u)) continue
                urls.push(u)
              }
              const bad = []
              for (const u of [...new Set(urls)]) {
                const alive = await probeUrl(u)
                if (alive === false) bad.push(u)
                else if (alive === null) core.info(`直链探测无结论（不判定为死链）：${u}`)
              }
              return bad
            }

            /**
             * 审核通过时把对象从 upload/ 迁到 releases/，返回「旧键 → 新键」的映射。
             *
             * ⚠️ 这个函数**只复制，不删除源对象**。删源放在推送成功之后的独立步骤里做 ——
             *    源对象必须活到「新引用已经推上去」那一刻：万一推送失败（并发冲突等），
             *    站点上跑的还是旧数据（指着 upload/），这时候把源删了就是整站 404。
             *    某一条复制失败就**不改它的引用**，保留 upload/ 原样 —— 那条链接照样能用，
             *    只是没享受到 releases/ 的目录语义，不能算错。
             */
            const promoteKeys = async (keys) => {
              const map = new Map()
              const unique = [...new Set((keys || []).filter((k) => /^upload\//.test(k)))]
              if (!unique.length) return map
              const token = process.env.PURGE_TOKEN
              if (!token) {
                core.warning(`未配置 PURGE_TOKEN，跳过 ${unique.length} 个对象的迁移（引用保持 upload/ 不变）`)
                return map
              }
              for (const key of unique) {
                try {
                  const res = await fetch(`${process.env.PURGE_BASE}/api/promote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Purge-Token': token },
                    body: JSON.stringify({ key })
                  })
                  const j = await res.json().catch(() => ({}))
                  if (res.ok && j.to) map.set(key, j.to)
                  else core.warning(`迁移失败（HTTP ${res.status}）：${key}${j && j.error ? ' —— ' + j.error : ''}`)
                } catch (e) {
                  core.warning(`迁移异常：${key}（${e && e.message}）`)
                }
              }
              return map
            }

            /**
             * 把一条引用里的对象键换成新键，**保持原来的写法**。
             *
             * ⚠️ 这里刻意用字符串替换，而不是 `new URL(...).searchParams.set(...)` 再序列化：
             *    URLSearchParams 会把键里的空格编成 '+'，而我们当初是用 encodeURIComponent
             *    编成 '%20' 的 —— 重新序列化之后键就不是原来那个了，图标会 404。
             */
            const rewriteRef = (url, map, moved) => {
              const raw = String(url ?? '')
              const key = ossKeyOfUrl(raw)
              if (!key || !map.has(key)) return raw
              const to = map.get(key)
              const from = encodeURIComponent(key)
              const next = /^oss:\/\//i.test(raw)
                ? `oss://${to}`
                : raw.includes(from)
                  ? raw.replace(from, encodeURIComponent(to))
                  : raw
              if (next !== raw && !moved.includes(key)) moved.push(key)
              return next
            }

            /** 整份数据里的引用都换一遍（图标 + 各下载项） */
            const rewriteData = (d, map, moved) => {
              if (!map.size) return d
              if (d.icon) d.icon = rewriteRef(d.icon, map, moved)
              for (const item of Array.isArray(d.downloads) ? d.downloads : []) {
                if (item && item.url) item.url = rewriteRef(item.url, map, moved)
              }
              return d
            }

            if (label === 'approved' || isOverwrite) {
              const exists = fs.existsSync(appsPath)
              if (exists && !isOverwrite) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `❌ 已存在同名文件 \`${appsDisplay}\`。请先删除旧文件或让提交者改 ID 后重新提交。\n\n`
                    + `> 若确实要用**本次提交**整份覆盖站内那份，请改打 \`${OVERWRITE_LABEL}\` 标签`
                    + `（图标 / 版本号 / 下载直链都会以本次提交为准；旧内容会自动附在本 Issue 评论里）。`
                })
                return
              }
              // 覆盖前先把旧版整份读出来留档，避免「黑箱覆盖」
              let oldData = null
              if (exists) {
                try {
                  oldData = JSON.parse(fs.readFileSync(appsPath, 'utf8'))
                } catch (e) {
                  oldData = null
                }
              }
              // 合并前剥掉所有「审核用元数据」字段：一律以 `_` 开头
              // （`_提交时间` / `_原始ID冲突` / `_联系方式`……），它们只服务于审核环节，
              // 不属于站点数据契约（字段表见 软件数据/README-维护手册.md）。
              // 按前缀过滤而不是逐个列举，是为了以后加字段不用再回来改这里。
              const clean = { ...data }
              for (const key of Object.keys(clean)) {
                if (key.startsWith('_')) delete clean[key]
              }
              // 审核通过 → 对象从 upload/ 迁到 releases/（服务端复制，不吃外网流量），
              // 并把这份数据里的引用改成新键。真正删源留到推送成功之后。
              const moved = []
              try {
                const map = await promoteKeys(collectOssKeys(clean))
                rewriteData(clean, map, moved)
                if (map.size) {
                  core.info(`已迁移 ${map.size} 个对象到 releases/，其中 ${moved.length} 条引用已改写`)
                }
              } catch (e) {
                // 迁移只是「目录语义 + 不让 upload/ 越堆越多」，失败也必须让审核本身继续跑完
                core.warning(`对象迁移环节异常：${e && e.message}`)
              }
              // 上线前探一次外部直链（清单 #10）。探测放在写文件之前，结论才好一并写进评论。
              let linkMiss = []
              try {
                linkMiss = await checkExternalLinks(clean)
              } catch (e) {
                core.warning(`直链存活校验环节异常（不影响审核）：${e && e.message}`)
              }

              fs.writeFileSync(appsPath, JSON.stringify(clean, null, 2))
              fs.unlinkSync(submissionPath)

              let tail = ''
              if (linkMiss.length) {
                tail += `\n\n⚠️ 上线前探测到 **${linkMiss.length} 条下载直链不通**（没回 2xx/3xx）：`
                  + linkMiss.map((u) => `\n- \`${u.replace(/`/g, "'")}\``).join('')
                  + '\n\n> 有些站点会拒绝 HEAD 或需要鉴权后再跳转，也可能是当时网络抖动 —— '
                  + '请人工点开确认一下。确实是死链的话，把这条 Issue 改打 `rejected` 撤下来，'
                  + '或让提交者补一条新链接。'
              }
              if (oldData) {
                tail = '\n\n' + diffTable(oldData, clean)
                  + '\n\n<details><summary>旧版完整内容（覆盖前存档）</summary>\n\n```json\n'
                  + JSON.stringify(oldData, null, 2)
                  + '\n```\n\n</details>'
              }

              // 覆盖是整份替换：旧版引用的桶对象若这份新提交不再引用，就成了孤儿。
              // 但清理**同样要等推送成功** —— 推送失败时站点上跑的还是旧那份数据，
              // 那些「不再被引用」的键其实还在被引用着。
              const stale = oldData
                ? collectOssKeys(oldData).filter((k) => !new Set(collectOssKeys(clean)).has(k))
                : []
              fs.writeFileSync(
                MOVE_PLAN,
                JSON.stringify({ src: [...new Set([...moved, ...stale])] }, null, 2)
              )
              if (stale.length) {
                tail += `\n\n本次提交不再引用的 ${stale.length} 个旧对象，会在推送**成功之后**清理`
                  + `（推送失败就留着，避免把还在被引用的对象删掉）：`
                  + stale.map((k) => `\n- \`${k}\``).join('')
              }

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `✅ 已${exists ? '覆盖' : '合并到'} \`${appsDisplay}\`，稍后自动构建上线。` + tail
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            } else if (label === 'rejected') {
              // 审核不通过 → 草稿和桶里那份一起删，不留孤儿对象。
              // requireRegistry：登记表里没有的键一律拒删 —— 拒绝的依据是投稿内容本身，
              // 不能让「投稿里写了什么」变成「桶里就能删什么」。
              const purged = await purgeKeys(collectOssKeys(data), { requireRegistry: true })
              fs.unlinkSync(submissionPath)
              const purgeLine = purged.length
                ? `\n\n同时清理了桶里的 ${purged.length} 个文件：`
                  + purged.map((k) => `\n- \`${k}\``).join('')
                : ''
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: '🗑️ 已删除草稿文件，Issue 关闭。' + purgeLine
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            }

      - name: 提交更改
        id: commit
        # 标签名 / Issue 号一律经 env 传进来，不直接拼进脚本正文（与仓库其它工作流一致的写法）
        env:
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠️ 本仓库路径几乎全是中文。git 默认 core.quotePath=true，会把非 ASCII 路径
          #    转义成八进制序列再输出，下面按 回声洞/messages/message*.json 判形的逻辑
          #    会全部匹配不上（2026-10-04 本地模拟时踩到）。关掉它，读取侧另用 -z 兜底。
          git config core.quotePath false
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "review: $LABEL_NAME #$ISSUE_NUMBER"

          # 兜底：万一仍有并发（队列未生效、外部同时推送等），反复 rebase 到最新 main 重试。
          # ⚠️ 重试前必须先 `git rebase --abort`：上一轮 rebase 撞冲突会停在游离 HEAD 上，
          #    不清理的话之后每次 `git push` 都只报 "You are not currently on a branch"，
          #    8 次重试全是空转 —— 2026-10-04 09:47 那三条回声洞就是这么丢的。
          ok=""
          for i in $(seq 1 8); do
            if git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            git fetch --no-tags origin main || true
            if git rebase origin/main; then sleep $((RANDOM % 3 + 1)); continue; fi

            # rebase 冲突。目前唯一预期的是回声洞字条编号撞车：两个运行各自算出同一个
            # messageN.json（add/add）。两份内容都是有效投稿，谁都不能丢 ——
            # 远端那份留在原编号，本次这份挪到下一个空号，然后把 rebase 继续下去。
            bad=""
            # 用 -z 按 NUL 切分读文件名：中文路径不会因空格/引号被拆错或转义
            while IFS= read -r -d '' f; do
              case "$f" in
                回声洞/messages/message*.json)
                  # rebase 过程中 index 的 :2: 是 upstream（远端）那份，:3: 是本次提交那份
                  git show ":3:$f" > "$RUNNER_TEMP/echo-ours.json"
                  git show ":2:$f" > "$f"
                  git add -- "$f"
                  newmax=$( { git ls-tree -r --name-only HEAD -- 回声洞/messages/; ls 回声洞/messages/ 2>/dev/null | sed 's#^#回声洞/messages/#'; } \
                            | sed -n 's#^回声洞/messages/message\([0-9]\+\)\.json$#\1#p' | sort -n | tail -1 )
                  newmax=${newmax:-0}
                  target="回声洞/messages/message$((newmax + 1)).json"
                  mv "$RUNNER_TEMP/echo-ours.json" "$target"
                  git add -- "$target"
                  echo "回声洞编号撞车：$f → $target（远端那份保留）"
                  ;;
                *) bad="$f" ;;
              esac
            done < <(git diff --name-only -z --diff-filter=U)
            if [ -n "$bad" ]; then
              echo "::error::出现无法自动处理的冲突：$bad"
              git rebase --abort 2>/dev/null || true
              break
            fi
            GIT_EDITOR=true git rebase --continue || true
          done

          if [ "$ok" != "1" ]; then
            # 以前这一步只把运行打红，Issue 上却留着「✅ 已收进 …」的评论，维护者会以为
            # 成功了。这里补一条失败提示，别让投稿悄悄丢掉。
            gh issue comment "$ISSUE_NUMBER" \
              --body "⚠️ 这条投稿已通过校验，但**推送提交时失败**（多半是同时有多条一起过审）。它**还没有生效**，请重新给本 Issue 打一次标签重试。" \
              || true
            echo "::error::推送失败（多次重试后仍冲突），请重新给该 Issue 打一次标签。"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 推送成功之后才删源对象 —— 顺序是刻意的。源对象必须活到「新引用已经推上去」那一刻：
      # 上面那步一旦推送失败（多条同时过审导致的冲突等），站点上跑的还是旧数据（指着
      # upload/），这时候把源删了就是整站 404。所以清理只在这一步做，且只在 changed=true 时做。
      - name: 清理迁移后的源对象
        if: steps.commit.outputs.changed == 'true'
        env:
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
          PURGE_BASE: https://submit.132614.xyz
        run: |
          F="$RUNNER_TEMP/oss-move-plan.json"
          if [ ! -f "$F" ]; then echo "本轮没有需要清理的桶对象"; exit 0; fi
          BODY=$(python3 -c "import json;print(json.dumps({'keys':json.load(open('$F')).get('src',[])}))")
          if [ "$BODY" = '{"keys": []}' ]; then echo "本轮没有需要清理的桶对象"; exit 0; fi
          echo "清理：$BODY"
          # 失败只告警，绝不把这次审核判成失败：引用已经换成 releases/ 了，清不掉只是多留
          # 一个孤儿对象，由 6 小时一次的桶对账任务报出来。
          # 兜一层：万一以后有人在这段里加了调试输出，token 也不会带进 CI 日志
          echo "::add-mask::$PURGE_TOKEN"
          curl -sS -X POST "$PURGE_BASE/api/purge" \
            -H "Content-Type: application/json" \
            -H "X-Purge-Token: $PURGE_TOKEN" \
            -d "$BODY" || echo "::warning::桶对象清理失败，稍后由对账任务报出"
