name: 检查应用更新

# 「软件信息自动更新」：每周核对站内 软件数据/apps/*.json 记录的最新版本与下载直链，
# 然后**分两路处理**：
#
#   ① 脚本能自己确定的更新 → 直接写回 JSON、提交、并触发部署（每周五无人值守自动跑）
#   ② 脚本不敢动的          → 汇总成一个「待人工确认」Issue，由维护者在里面逐条决定：
#                              「跟进」＝去别处改 JSON → 提交 → 回来点那条的「已改好 → 重新检测」方框
#                              「不管」＝点那条的「不用跟进」方框（永久忽略）；全部处理完自动关闭。
#
# **版本来源只有 GitHub Releases 一条**（见 scripts/check-updates.mjs）：
#   认 apps/*.json 的 `github` 字段，本站收录的开源软件走这条。
#   （2026-09-21 起，原「非 GitHub 官方来源」那条腿**已整体删除**：它靠抓希沃 / 360 / VLC /
#    DiskGenius / GeoGebra 的厂商页面，来跟 10 个没有仓库的软件，但厂商一改版就得跟着改解析规则，
#    维护成本不划算。那些软件现改由 scripts/untracked-buckets.mjs 登记为「跟不了」。）
#
#   ⚠️ 2026-09-26 补了**第二条腿，但它不管版本、只管直链**：scripts/resolve-direct-links.mjs
#      （本文件下面那一步）按厂商产品码 / winget 官方清单，把「官网下载页」换成文件直链，
#      让详情页能**原地下载**而不是把用户送去官网自己找安装包。
#      它故意不碰 version 字段（跨大版本、日期后缀这类判断留给人工），
#      所以**版本仍只有 GitHub 一条腿**，两句话不矛盾。
#   确认跟不了上游的（微软商店分发、官方固定「最新版」直链、有意归档、只有网页入口、第三方网盘）
#   **逐个写明是哪一种**（scripts/untracked-buckets.mjs 的 BUCKETS 表），由 Issue 的「跟不了」分区如实列出 ——
#   它们**不产生待审条目**：不是「待确认」，而是「本来就跟踪不了」，点不动的方框只会变成噪音。
#
# Issue 正文**刻意写得很短**（顶部一行数字 + 一张分档导航表 + 只列要人裁决的条目，其余全折叠）——
# 改 buildPendingReport() 时别加「一句话结论」这类小标题、别把同一批数字印两遍。
# 本工作流**按标题**定位 Issue、只解析 `<!-- action:id=… -->` 标记，**不解析正文章节**，故正文可自由重构。
#
# 待审条目按「人要做哪一件事」分成 5 档（见 buildPendingReport 的 groups）：
#   ① 直链打不开 → 换链接　② 有新版本但要拍板　③ 版本号对不上　④ 仓库信息有问题　⑤ 官网链指着旧版
#
# 脚本不敢动的情况（都会进 Issue）：跨大版本、下载项带校验值（hash 字段 / note 里的 SHA512）、
# 来源里找不到对应的下载文件、仓库地址查不到、下载直链失效，
# 以及**非 GitHub 直链（官网 / 镜像）与站内版本号对不上**（脚本不会改这些链接，只能人换 ——
# 这类以前挂在「有更新」上，结果版本一自动升好就再没人提醒，7-Zip 的官网链就漏过两条）。
# 判定原则是「全有或全无」：一个软件的版本号与它的直链是一个整体，只要有一处搞不定就一个字都不改，
# 否则会出现「版本号是新的、直链还是旧文件」这种自相矛盾的数据。
#
# 忽略清单：软件数据/update-ignore.json —— 在 Issue 里**点一下「不用跟进」方框**就会写入
# （等价于回复 `/ignore <软件id>`），由 .github/workflows/update-ignore-command.yml 落地；
# 点「已改好 → 重新检测」方框则由它**重新派发本工作流**（人不在这里改数据，改完只回来说一声）。
#
# ⚠️ 三条沿用本项目既有经验的约定：
#  1. 用 GITHUB_TOKEN 提交的 push **不会**触发 deploy.yml（GitHub 防递归），
#     所以写回之后必须显式 `gh workflow run deploy.yml`（workflow_dispatch 是这条限制的唯一例外）。
#  2. 脚本只逐文件读写 软件数据/apps/*.json 并保持原行尾 —— 本仓没有 .gitattributes，行尾是混合的，
#     整文件重写会产生假 diff。
#  3. 体检与 Issue 是**同一次**运行产出的（update-report.md 与 update-pending.md），
#     不要拆成两步各跑一次脚本，那样会把 GitHub API 调用量翻倍。

on:
  schedule:
    # 每周五 01:00 UTC（北京 09:00）—— 放在周五，体检出的问题正好在周末前给维护者过一遍
    - cron: '0 1 * * 5'
  workflow_dispatch:
    inputs:
      apply:
        description: 自动写回能确定的更新并部署（默认开；取消勾选＝只体检、不动数据）
        type: boolean
        default: true
      skip-link-check:
        description: 跳过下载直链存活检查（更快，离线友好）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # ⚠️ 并发组必须与 update-ignore-command.yml 的 tick / ignore 两个 job **同名**。
    #    三者都会「读 软件数据/update-ignore.json → 改 → 整份重写」（这里由 --apply 顺手清
    #    过期的 `_skip_once` 记录），而并发组不同就是**互不排队**：
    #    每周体检清理 `_skip_once` 的同时，维护者正好点一下「本次跳过」，
    #    后写的一方基于旧快照整份覆盖 → 刚记下的记录凭空消失（2026-09-25 审计发现）。
    #    推送重试里的 rebase 只解决「推不上去」，救不回「基于旧快照算出来的写入」。
    concurrency:
      group: update-ignore
      queue: max
    permissions:
      contents: write
      issues: write
      # 需要 actions:write 才能派发 deploy.yml（见下方「触发构建与部署」）
      actions: write
    env:
      # 定时任务默认写回；手动触发看勾选。同一个表达式在多个步骤里复用，避免两处判断不一致
      AUTO_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
    steps:
      - name: 取出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 体检并生成报告
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_LINK: ${{ inputs.skip-link-check }}
        run: |
          ARGS="--report=update-report.md --pending=update-pending.md"
          if [ "$SKIP_LINK" = "true" ]; then ARGS="$ARGS --no-link"; fi
          if [ "$AUTO_APPLY" = "true" ]; then
            ARGS="$ARGS --apply"
          else
            echo "（本次只体检，不写回数据）"
          fi
          echo "运行：node scripts/check-updates.mjs $ARGS"
          node scripts/check-updates.mjs $ARGS

      - name: 解析非 GitHub 应用的下载直链
        # 「没有 GitHub 仓库」的软件（微信 / QQ / WPS / 钉钉 / 腾讯会议 / 希沃全家桶…）
        # 靠它把「官网下载页」换成文件直链，详情页才能原地下载 —— 见 scripts/resolve-direct-links.mjs。
        # 与上面的体检共用同一次提交（写入的也是 软件数据/apps，已包含在下方 git add 里）。
        if: env.AUTO_APPLY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-direct-links.mjs --apply --report=resolve-report.md

      - name: 把完整报告写进运行摘要
        if: always()
        run: |
          for f in update-report.md resolve-report.md; do
            if [ -f "$f" ]; then
              echo "## $f" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ ! -f update-report.md ] && [ ! -f resolve-report.md ]; then
            echo "没有生成报告文件" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交写回的改动
        id: apply
        if: env.AUTO_APPLY == 'true'
        run: |
          # 两个文件：apps 目录（版本 / 直链）+ update-ignore.json（脚本顺手清掉的过期「本次跳过」记录）。
          # 脚本已按原行尾写文件，这里不做任何格式化。
          if git diff --quiet -- 软件数据/apps 软件数据/update-ignore.json; then
            echo "没有需要写回的改动"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 软件数据/apps 软件数据/update-ignore.json
          git commit -m "chore(data): 自动更新软件版本与下载直链

          由 .github/workflows/check-updates.yml 触发 scripts/check-updates.mjs 生成。
          仅包含脚本能完全确定的部分；不确定的条目进「待人工确认」Issue。"

          # 与 review-submission.yml 一致的宽松重试：并发场景下 push 可能被顶掉
          ok=""
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then ok=1; break; fi
            git pull --rebase origin main || true
            sleep $((RANDOM % 3 + 1))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::推送失败（多次重试后仍冲突），请手动重跑本次工作流。"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发构建与部署
        # ⚠️ GITHUB_TOKEN 推送产生的 push 事件不会触发其它工作流，必须显式派发（同 review-submission.yml）
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: 开 / 更新「待人工确认」Issue
        if: always() && steps.check.outputs.pending != ''
        uses: actions/github-script@v7
        env:
          PENDING_COUNT: ${{ steps.check.outputs.pending }}
          UPDATED_COUNT: ${{ steps.check.outputs.updated }}
        with:
          script: |
            const fs = require('fs')
            const PENDING = 'update-pending.md'
            if (!fs.existsSync(PENDING)) {
              core.warning('没有待审清单文件，跳过 Issue 步骤')
              return
            }
            // GitHub Issue 正文上限 65536 字符，超出部分截断
            let body = fs.readFileSync(PENDING, 'utf8')
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…（清单过长，已截断）'

            const count = Number(process.env.PENDING_COUNT || 0)
            const updated = Number(process.env.UPDATED_COUNT || 0)

            const TITLE = '软件信息体检 · 待人工确认'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const stamp = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC'
            // ⚠️ 清单正文（update-pending.md）自带 H1 标题与「最近一次检查」时间，
            //    这里只要补一个「本次运行」链接 —— 再写一遍标题和时间，Issue 里就会重复两套。
            const linkLine = `[本次运行](${runUrl})\n\n`
            // 关闭时清单正文已经不在了，得自己把时间写全
            const doneHeader = `_最近一次检查：${stamp}　·　[本次运行](${runUrl})_\n\n`

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const found = issues.find((i) => i.title.includes('软件信息体检'))

            // 全局体检、待确认 0 条 → 收工，把 Issue 关掉
            if (count === 0) {
              if (!found) {
                core.info('本次没有需要人工确认的条目，且没有已开的 Issue，什么都不用做')
                return
              }
              const done = doneHeader + '## 全部处理完了\n\n' +
                `本次体检\`${updated}\` 个软件自动更新完毕，没有需要人工确认的条目。\n\n` +
                '下一次体检若发现新的问题，会自动重新打开本 Issue。\n'
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body: done, state: 'closed',
              })
              core.info(`没有待确认条目，已关闭 Issue #${found.number}`)
              return
            }

            if (found) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body: linkLine + body, state: 'open',
              })
              core.info(`已更新待人工确认 Issue #${found.number}（${count} 条）`)
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body: linkLine + body,
              })
              core.info(`已新建待人工确认 Issue #${created.data.number}（${count} 条）`)
            }
