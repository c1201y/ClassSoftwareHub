name: 创建审核 Issue

on:
  push:
    branches: [main]
    paths:
      - 'submissions/*.json'
  # 手动补票：把 submissions/ 里「还没有 Issue」的草稿全部捞出来建 Issue。
  # 为什么需要：草稿只有在推送那一刻才会被建 Issue，一旦那一刻静默失败（见下面
  # 「判重认路径不认标题」那段），草稿就会一直躺在 submissions/ 里没人审。
  # 有了这个开关，维护者随时能一键把漏掉的草稿重新捞起来。
  workflow_dispatch:

jobs:
  create-issue:
    runs-on: ubuntu-latest
    # 反馈草稿要在开完 Issue 后删掉：删文件也是一次 push，与「审核合并」那条管道
    # （review-submission.yml）可能同时发生，两边都靠 rebase 重试兜底。
    concurrency:
      # 与 review-submission / check-updates / update-ignore-command 共用一个组：
      # 这几条管道都会 push 改仓库数据（submissions/、apps/、版本表），
      # 并行跑会互相抢 main（各自 rebase 重试能兜住，但排队更省心）。
      # GitHub 的并发组全仓库同名即互斥，跨工作流也生效；默认不取消、只排队。
      group: repo-data-write
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      # fetch-depth: 0 —— 下面的 git diff 要拿到事件里的两个提交对象，浅克隆可能缺
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 找出本次新增的草稿文件
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # ⚠️ 不能用 `git diff HEAD~1 HEAD`：checkout 检出的是【fetch 那一刻的分支 tip】，
          #    未必是触发本次运行的那个提交。两次推送挨得近时会重复建 issue，甚至完全
          #    漏建（草稿静默滞留在 submissions/ 里，永远等不到审核）。
          #    改用事件自带的 before/after 两个 SHA，范围精确，且能覆盖一次推送多个提交。
          # 手动 dispatch 时没有 before/after："本次新增"就是空，这时交给后面
          # 「扫描 submissions/ 里所有还没有 Issue 的草稿」那段去补票。
          if [ -z "$AFTER" ]; then
            echo "手动触发：不按提交范围找草稿，改为扫描 submissions/ 里所有还没有 Issue 的草稿"
            printf 'files<<EOF\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            NEW_FILES=$(git show --diff-filter=A --name-only --pretty=format: "$AFTER" -- 'submissions/*.json' || true)
          else
            NEW_FILES=$(git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'submissions/*.json' || true)
          fi
          echo "本次新增的草稿："
          echo "$NEW_FILES"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 为每个草稿创建 Issue
        id: create
        # 手动 dispatch 时 before/after 是空的（找不出「本次新增」），但正好要靠下面的
        # 「所有还没有 Issue 的草稿」那一段补票，所以这种时候也要跑。
        if: steps.find.outputs.files != '' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          FILES: ${{ steps.find.outputs.files }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const stage = process.cwd()
            const files = process.env.FILES.split('\n').map(s => s.trim()).filter(Boolean)

            // 反馈草稿是「一次性投递载体」：Issue 一建出来它的使命就结束了，
            // 要由后面的「收起已开 Issue 的反馈草稿」步骤删掉（不删会一直躺在
            // 「待审核队列」目录里）。这里把它们收集起来传出去。
            const feedbackDrafts = []
            const isFeedbackDraft = (p) => /^submissions\/feedback-[^/]+\.json$/.test(p)

            // ── Markdown 安全渲染 ──────────────────────────────────────────────
            // 下面每一个字符串都来自**匿名投稿接口**，却要直接拼进 Issue 正文。
            // GitHub 会过滤 HTML 标签，但 Markdown 元字符照样生效：
            //   反引号    → 提前结束 `代码段`，后面的字变成正文甚至格式；
            //   三反引号  → 提前闭合 ```json 围栏，把任意内容提升为正文；
            //   @名字     → 真的会通知到人（拿来刷骚扰最省事）；
            //   #数字 / ![]() → 变成交叉引用与外部请求（追踪像素）。
            // 规矩：**凡是用户给的字符串，进正文前一律过一道**，一个都不许裸奔。
            const mdSafe = (v, max = 300) =>
              String(v ?? '')
                .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '')
                .replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, '')
                .replace(/\r\n?/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .trim()
                .slice(0, max)
            // 行内片段：连换行一起压平，反引号与竖线换成单引号（既不破代码段也不破表格）
            const mdInline = (v, max = 300) =>
              mdSafe(v, max).replace(/[`|]/g, "'").replace(/\s*\n\s*/g, ' ')
            // 代码块内容：把围栏本身打断，否则内容里的 ``` 能提前闭合代码块
            const mdFence = (v, max = 20000) => mdSafe(v, max).replace(/```/g, "'''")
            // 引用块：逐行加 '> '，并且逐行打断围栏
            const mdQuote = (v, max = 8000) =>
              mdFence(v, max)
                .split('\n')
                .map((line) => (line.trim() ? `> ${line}` : '>'))
                .join('\n')

            // 幂等保护：手动「Re-run」时 before/after 不变，不判重会重复建 issue。
            // ⚠️ 判重必须认【草稿文件路径】，不能认 Issue 标题（2026-09-20 踩过）：
            //    标题是「软件名 (id)」，同一个软件被重新提交时新标题与旧 Issue 一模一样，
            //    而旧 Issue 早就 approved / rejected 关闭了 —— 按标题判重会把新草稿
            //    永久静默。实测：`向日葵远程 (xrkayxingz)` 的第二次提交（9-20 12:06）
            //    就因为 9-18 的旧 Issue #19 已关闭而被跳过，运行日志里只剩一行
            //    「已存在同名 Issue，跳过：[待审核] 向日葵远程 (xrkayxingz)」，
            //    草稿从此躺在 submissions/ 里，永远等不到审核（提交者看到的是「提交成功」）。
            //    草稿路径带时间戳、天然唯一，一个路径只可能对应一条草稿。
            //    ⚠️ 必须用 paginate **翻完全部页**，不能只取第一页 100 条
            //    （2026-09-21 修）：下面靠遍历「已存在的 Issue 正文」收集已建过 Issue 的
            //    草稿路径，用 `state: 'all'`（含已关闭的历史 Issue）。仓库一旦累积超过
            //    100 个 Issue，第 101 条往前的正文就读不到了 —— 那些草稿会被判成「还没有
            //    Issue」，于是**重复建 Issue**。仓库是公开的、Issue 只增不减，
            //    这个上限迟早会撞上，所以这里一次性改为分页拉全。
            //    另外 `state: 'all'` 会把已关闭的一并拉回，仓库长期跑下来条数不小，
            //    好在这是每次推送只跑一次的低频操作，翻页的开销可以接受。
            const opened = await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: 'all', per_page: 100 },
              // 只关心编号/标题/正文，少传点数据
              (response) => response.data.map((i) => ({ title: i.title, body: i.body }))
            )
            const drafted = new Set()
            for (const i of opened) {
              const m = (i.body || '').match(/\*\*提交文件\*\*：`([^`]+)`/)
              if (m) drafted.add(m[1])
            }
            // 标题只用来提醒：同一个软件可能同时有多条草稿在审（比如改名重提），
            // 那是对的，不该拦。
            const existingTitles = new Set(opened.map(i => i.title))

            // 除了本次推送新增的草稿，再把【所有还没有 Issue 的草稿】一起捞上：
            // 漏建过的草稿因此能在下一次提交时自动补票，不会再无声无息地卡住。
            for (const f of (fs.existsSync('submissions') ? fs.readdirSync('submissions') : [])) {
              const p = `submissions/${f}`
              if (f.endsWith('.json') && !files.includes(p)) files.push(p)
            }

            for (const file of files) {
              if (!fs.existsSync(file)) continue
              if (drafted.has(file)) {
                console.log(`该草稿已有 Issue，跳过：${file}`)
                // 反馈草稿例外：Issue 已存在 = 它的使命已完成，大概率是上一轮删草稿时
                // 推送失败（这里补一笔，让下面那步收走）。软件 / 回声洞的草稿要等审核，
                // 绝不能在这里顺手删掉。
                if (isFeedbackDraft(file)) feedbackDrafts.push(file)
                continue
              }
              // ⚠️ 单条草稿只允许失败它自己：JSON.parse 对坏文件直接 throw，不拦的话
              //    一条手滑写坏的草稿会让整轮终止，排在后面的草稿全都建不出 Issue。
              let data
              try {
                data = JSON.parse(fs.readFileSync(file, 'utf8'))
              } catch (e) {
                core.warning(`草稿 ${file} 不是合法 JSON，已跳过（${e && e.message}）。请人工检查：修复或删除该文件。`)
                continue
              }
              if (typeof data !== 'object' || data === null || Array.isArray(data)) {
                core.warning(`草稿 ${file} 顶层不是 JSON 对象，已跳过。请人工检查。`)
                continue
              }

              // ── 回声洞字条：和「提交软件」同一条管道，只是 Issue 形态不同 ──
              // 草稿由 classhub worker 的 /api/echocave 写入，形如
              // `{ "_类型": "回声洞", "text": "…", "_提交时间": "…" }`。
              // 判重仍走下面的**文件路径**（drafted 集合），不认标题 —— 同一句话被投两次
              // 会得到同一个标题，但草稿路径带时间戳、天然唯一。
              if (data._类型 === '回声洞') {
                const echoText = String(data.text ?? '').trim()
                // 标题不进 Markdown 渲染，但仍要压平空白：换行 / 控制字符会把标题撑歪
                const echoTitle = `[待审核] 回声洞 · ${mdInline(echoText, 40)}`
                if (existingTitles.has(echoTitle)) {
                  console.log(`⚠️ 已有同名 Issue（历史记录或其它草稿），仍为这条草稿新建：${echoTitle}`)
                }
                const echoBody = [
                  `**提交文件**：\`${mdInline(file, 200)}\``,
                  '**类型**：回声洞字条',
                  `**提交时间**：${mdInline(data._提交时间, 40)}`,
                  '',
                  '**内容**：',
                  '',
                  mdQuote(echoText || '（空）'),
                  '',
                  '<details><summary>查看完整 JSON</summary>',
                  '',
                  '```json',
                  mdFence(JSON.stringify(data, null, 2)),
                  '```',
                  '',
                  '</details>',
                  '',
                  '---',
                  '**审核操作**：',
                  '- 打上 `approved` 标签 → 收进 `回声洞/messages/messageN.json`，随后自动上线',
                  '- 打上 `rejected` 标签 → 删除投稿，关闭 Issue',
                ].join('\n')
                try {
                  await github.rest.issues.create({
                    ...context.repo,
                    title: echoTitle,
                    body: echoBody,
                    labels: ['待审核']
                  })
                } catch (e) {
                  // 建 Issue 失败只算这一条失败：草稿留在原地下轮补票，别拖垮同批其它草稿
                  core.warning(`回声洞草稿建 Issue 失败（${e.message}），下轮会自动补票：${file}`)
                  continue
                }
                continue
              }

              // ── 反馈中心：直接开 Issue，没有「审核合并」这一步 ──
              // 草稿由 classhub worker 的 /api/feedback 写入，形如
              // `{ "_类型": "反馈", "kind": "report", "subKind": "link", "appId": "7-zip",
              //    "title": "…", "detail": "…", "contact": "<age 密文>", "_提交时间": "…" }`。
              // 这一条以前是让用户点开 GitHub 的 issues/new 自己填，现在改由站点直接投递 ——
              // 但终点没变：**Issue 本身就是反馈的归宿**，不存在「合并进仓库数据」的动作，
              // 所以这里开完 Issue 就把草稿收起（见后面「收起已开 Issue 的反馈草稿」）。
              if (data._类型 === '反馈') {
                const KIND_LABEL = { report: '报告问题', suggestion: '提出建议' }
                const SUB_LABEL = { interaction: '逻辑交互', link: '链接失效', other: '其他问题' }
                const kindLabel = KIND_LABEL[data.kind] || ''
                const subLabel = data.kind === 'report' ? (SUB_LABEL[data.subKind] || '') : ''
                const prefix = subLabel ? `${kindLabel} · ${subLabel}` : kindLabel
                // 标题会连同用户输入一起进 Issue 标题：压平空白 + 兜住空标题
                const subject = mdInline(data.title, 80) || '（未填写标题）'
                const fbTitle = prefix ? `[${prefix}] ${subject}` : subject
                // ⚠️ 标签名必须与仓库 Labels 一字不差；只要有一个不存在，issues.create 会整个
                //    失败并断言。所以下面建失败时会退一步「不带标签」重试，宁可少标签也不能不建。
                const labels = ['用户反馈']
                if (kindLabel) labels.push(kindLabel)
                if (subLabel) labels.push(subLabel)

                // 「涉及软件」：能读到站内数据就把名字补上，读不到（或 id 形状可疑）就只写 id
                let appLine = '站点本身 / 未指定'
                const appId = String(data.appId ?? '').trim()
                if (appId) {
                  let appName = ''
                  try {
                    if (/^[a-z0-9-]{1,60}$/.test(appId)) {
                      const appFile = path.join(stage, '软件数据', 'apps', `${appId}.json`)
                      if (fs.existsSync(appFile)) {
                        appName = String(JSON.parse(fs.readFileSync(appFile, 'utf8')).name ?? '')
                      }
                    }
                  } catch (e) {
                    appName = ''
                  }
                  appLine = appName
                    ? `${appName}（\`${appId}\`）· [详情页](https://classsoftwarehub.us.ci/#/download/${appId})`
                    : `\`${appId}\` · [详情页](https://classsoftwarehub.us.ci/#/download/${appId})`
                }

                const contact = String(data.contact ?? '').trim()
                const fbBody = [
                  mdQuote(String(data.detail ?? '').trim() || '（空）'),
                  '',
                  '---',
                  '',
                  '| 项目 | 内容 |',
                  '| --- | --- |',
                  `| 类型 | ${mdInline(prefix, 60) || '（未选择）'} |`,
                  `| 涉及软件 | ${mdInline(appLine, 200)} |`,
                  // 联系方式是本地 age 公钥加密后的密文（明文只留在提交者本机）；
                  // 密文是多行 ASCII armor，塞进表格会把表格撑破，所以单列一段代码块，
                  // 也方便维护者整段复制去用私钥解密。
                  ...(contact
                    ? ['', '### 联系方式（已在本地加密，仅维护者可用私钥解密）', '', '```', mdFence(contact), '```']
                    : []),
                  '',
                  '---',
                  '',
                  `**提交文件**：\`${mdInline(file, 200)}\``,
                  `**提交时间**：${mdInline(data._提交时间, 40)}`,
                  '',
                  '> 本条由站点「反馈中心」（`#/feedback`）直接投递，**无需审核合并** —— '
                    + 'Issue 本身就是它的归宿，处理完关闭即可。',
                ].join('\n')

                let made
                try {
                  made = await github.rest.issues.create({
                    ...context.repo,
                    title: fbTitle,
                    body: fbBody,
                    labels
                  })
                } catch (e) {
                  core.warning(`带标签建反馈 Issue 失败（${e.message}），改为不带标签重试`)
                  made = await github.rest.issues.create({ ...context.repo, title: fbTitle, body: fbBody })
                }
                console.log(`已建反馈 Issue #${made.data.number}：${fbTitle}`)
                feedbackDrafts.push(file)
                continue
              }

              // 标题里也必须压平：name 是用户自由文本，换行 / 控制字符会把标题撑歪
              const title = `[待审核] ${mdInline(data.name, 80)} (${String(data.id ?? '').replace(/[^a-z0-9-]/gi, '').slice(0, 60)})`
              if (existingTitles.has(title)) {
                console.log(`⚠️ 已有同名 Issue（历史记录或其它草稿），仍为这条草稿新建：${title}`)
              }
              const conflictHint = data._原始ID冲突
                ? `\n> ⚠️ **注意**：\`软件数据/apps/${data.id}.json\` 已存在，通过前需先处理冲突。`
                : ''
              // 联系方式（必填项，2026-09-16 起）：单独提到正文开头，管理员需要联系提交者时不用翻 JSON。
              // ⚠️ 这里为空时【不要】断言提交者漏填：提交页对它是硬性必填（buildPayload 的 missing
              //    检查包含 `!payload._联系方式`），空值根本发不出去。实测 2026-09-19 的草稿
              //    （issue #28 imageglass）里就没有这个字段，而 `_提交时间` / `_原始ID冲突` 都在 ——
              //    说明是提交服务写草稿时重建了 JSON，把它不认识的入参键丢掉了。
              //    所以缺字段只提示「请提交者在本 Issue 下回复」，不猜原因。
              const contact = String(data._联系方式 ?? '').trim()
              // 联系方式是本机加密后的 age ASCII armor（多行）。以前直接内联在 `**联系方式**：`
              // 后面，换行会把后面所有内容挤成正文；现在单列一个代码块，既安全又好复制。
              const contactLines = contact
                ? ['', '### 联系方式（已在本地加密，仅维护者可用私钥解密）', '', '```', mdFence(contact), '```']
                : ['', '**联系方式**：⚠️ 这条里没有。提交页对「联系方式」是必填，若提交者确认填过，'
                    + '说明提交接口没有把它写进草稿 —— 请让提交者在本 Issue 下直接回复联系方式。']
              // 投稿指纹：Worker 用它反查「同一台设备还挂着几条待审」（每台最多 3 条）。
              // 用 HTML 注释，渲染时看不见，也不会被上面的 mdFence 破坏。
              const sid = String(data._提交指纹 ?? '').replace(/[^a-f0-9]/gi, '').slice(0, 32)
              const sidLine = sid ? [`<!-- csh-submitter:${sid} -->`, ''] : []
              const body = [
                `**提交文件**：\`${mdInline(file, 200)}\``,
                `**软件 ID**：\`${mdInline(data.id, 60)}\``,
                `**分类**：\`${mdInline(data.category, 40)}\``,
                `**提交时间**：${mdInline(data._提交时间, 40)}`,
                ...sidLine,
                conflictHint,
                ...contactLines,
                '',
                '<details><summary>查看完整 JSON</summary>',
                '',
                '```json',
                mdFence(JSON.stringify(data, null, 2)),
                '```',
                '',
                '</details>',
                '',
                '---',
                '**审核操作**：',
                '- 打上 `approved` 标签 → 自动合并到 `软件数据/apps/`',
                '- 打上 `rejected` 标签 → 删除草稿，关闭 Issue',
              ].join('\n')

              try {
                await github.rest.issues.create({
                  ...context.repo,
                  title,
                  body,
                  labels: ['待审核']
                })
              } catch (e) {
                // 同上：单条失败不拖垮整轮；草稿留在 submissions/ 下轮自动补票
                core.warning(`投稿草稿建 Issue 失败（${e.message}），下轮会自动补票：${file}`)
                continue
              }
            }

            // 把要收起的反馈草稿传给下一步（多行文本；一个都没有就不传，下一步自然跳过）
            if (feedbackDrafts.length) {
              console.log(`待收起的反馈草稿：${feedbackDrafts.join(', ')}`)
              core.setOutput('feedback', feedbackDrafts.join('\n'))
            }

      - name: 收起已开 Issue 的反馈草稿
        # 反馈没有「审核合并」这一步：Issue 一建出来，草稿就完成了使命。不收走的话
        # submissions/（那是「待审核队列」目录）会慢慢堆满永远不会有下文的文件。
        # ⚠️ 收不动**不算失败**：Issue 已经建好，草稿留着只会被上面的判重跳过，下一次
        #    推送会自动重试。所以这里只 ::warning:: ，不把运行打红。
        if: steps.create.outputs.feedback != ''
        env:
          DRAFTS: ${{ steps.create.outputs.feedback }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 仓库路径几乎全是中文：git 默认 core.quotePath=true 会把它们转义成八进制，
          # 下面按 submissions/feedback-*.json 判形的 case 就全匹配不上（同 review-submission.yml）
          git config core.quotePath false

          while IFS= read -r f; do
            # ⚠️ 不要写成 `[ -z "$f" ] && continue`：Actions 的 run 默认是 `bash -e`，
            #    当 $f 非空时那条 AND-list 返回 1，会把整个脚本直接终止。
            #    空行交给 case 的空模式处理，不引入任何会返回非零的语句。
            case "$f" in
              "") ;;
              submissions/feedback-*.json) rm -f -- "$f" ;;
              *) echo "::warning::跳过非反馈草稿（不该出现在这里）：$f" ;;
            esac
          done <<< "$DRAFTS"

          git add -A
          if git diff --cached --quiet; then
            echo "没有需要收起的草稿"
            exit 0
          fi
          git commit -m "chore(feedback): 收起已开 Issue 的反馈草稿"

          # 与「审核合并」那条管道可能同时 push，撞上就 rebase 重试（同 review-submission.yml）
          for _ in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "反馈草稿已收起"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch --no-tags origin main || true
            if git rebase origin/main; then
              sleep $((RANDOM % 3 + 1))
              continue
            fi
            git rebase --abort 2>/dev/null || true
            break
          done
          echo "::warning::反馈草稿没能收起（推送失败）；Issue 已建，不影响处理。下次推送会自动重试。"
