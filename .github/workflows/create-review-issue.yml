name: Create Review Issue

on:
  push:
    branches: [main]
    paths:
      - 'submissions/*.json'

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # fetch-depth: 0 —— 下面的 git diff 要拿到事件里的两个提交对象，浅克隆可能缺
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 找出本次新增的草稿文件
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # ⚠️ 不能用 `git diff HEAD~1 HEAD`：checkout 检出的是【fetch 那一刻的分支 tip】，
          #    未必是触发本次运行的那个提交。两次推送挨得近时会重复建 issue，甚至完全
          #    漏建（草稿静默滞留在 submissions/ 里，永远等不到审核）。
          #    改用事件自带的 before/after 两个 SHA，范围精确，且能覆盖一次推送多个提交。
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            NEW_FILES=$(git show --diff-filter=A --name-only --pretty=format: "$AFTER" -- 'submissions/*.json' || true)
          else
            NEW_FILES=$(git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'submissions/*.json' || true)
          fi
          echo "本次新增的草稿："
          echo "$NEW_FILES"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 为每个草稿创建 Issue
        if: steps.find.outputs.files != ''
        uses: actions/github-script@v7
        env:
          FILES: ${{ steps.find.outputs.files }}
        with:
          script: |
            const fs = require('fs')
            const files = process.env.FILES.split('\n').map(s => s.trim()).filter(Boolean)

            // 幂等保护：手动「Re-run」时 before/after 不变，不判重会重复建 issue
            const opened = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'all',
              per_page: 100
            })
            const existingTitles = new Set(opened.data.map(i => i.title))

            for (const file of files) {
              if (!fs.existsSync(file)) continue
              const data = JSON.parse(fs.readFileSync(file, 'utf8'))
              const title = `[待审核] ${data.name} (${data.id})`
              if (existingTitles.has(title)) {
                console.log(`已存在同名 Issue，跳过：${title}`)
                continue
              }
              const conflictHint = data._原始ID冲突
                ? `\n> ⚠️ **注意**：\`软件数据/apps/${data.id}.json\` 已存在，通过前需先处理冲突。`
                : ''
              // 联系方式（必填项，2026-09-16 起）：单独提到正文开头，管理员需要联系提交者时不用翻 JSON。
              // 老草稿 / 兜底通道提交的文件可能没有这个字段，给个显眼的缺省提示。
              const contact = String(data._联系方式 ?? '').trim()
              const contactLine = contact
                ? `**联系方式**：${contact}`
                : '**联系方式**：⚠️ 未填写（提交页自 2026-09-16 起为必填项，此条可能来自更早的提交或兜底通道）'
              const body = [
                `**提交文件**：\`${file}\``,
                `**软件 ID**：\`${data.id}\``,
                `**分类**：\`${data.category}\``,
                `**提交时间**：${data._提交时间}`,
                contactLine,
                conflictHint,
                '',
                '<details><summary>查看完整 JSON</summary>',
                '',
                '```json',
                JSON.stringify(data, null, 2),
                '```',
                '',
                '</details>',
                '',
                '---',
                '**审核操作**：',
                '- 打上 `approved` 标签 → 自动合并到 `软件数据/apps/`',
                '- 打上 `rejected` 标签 → 删除草稿，关闭 Issue',
              ].join('\n')

              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['待审核']
              })
            }
