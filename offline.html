<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>暂时离线 · ClassSoftwareHub</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f3f3;
        --card: #ffffff;
        --stroke: rgba(0, 0, 0, 0.08);
        --text: #1a1a1a;
        --secondary: #5f5f5f;
        --accent: #0067c0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202020;
          --card: #2b2b2b;
          --stroke: rgba(255, 255, 255, 0.08);
          --text: #f5f5f5;
          --secondary: #bdbdbd;
          --accent: #4cc2ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .glyph {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--accent);
        font-size: 28px;
      }
      h1 { font-size: 22px; margin: 0 0 10px; font-weight: 600; }
      p { margin: 0 0 8px; color: var(--secondary); line-height: 1.7; font-size: 14px; }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.06); }
      .en { margin-top: 18px; font-size: 12.5px; color: var(--secondary); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="glyph" aria-hidden="true">&#xE1D3;</div>
      <h1>暂时连不上网络</h1>
      <p>页面已缓存的部分仍可继续浏览；如果这一步失败，请检查网络后重试。</p>
      <button type="button" onclick="location.reload()">重新加载</button>
      <p class="en">You appear to be offline. Check your connection and try again.</p>
    </main>
  </body>
</html>
