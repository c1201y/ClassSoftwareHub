<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline';" />
  <title>无法访问网站</title>
  <!-- 最坏情况的兜底页：网站打不开、且这个安装包里也没有离线副本。
       正常路径永远不会看到它（有副本时离线会走副本）。 -->
  <style>
    :root { --text: #1b1b1b; --soft: #5c5c5c; --bg: #f3f3f3; --text-primary: #1b1b1b; }
    @media (prefers-color-scheme: dark) { :root { --text: #fff; --soft: #c8c8c8; --bg: #202020; --text-primary: #ffffff; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      /* 窗口没有系统标题栏，这页又没有站点标题栏可拖 —— 自己在顶部留一条拖动区 */
      -webkit-app-region: drag;
    }
    .box { max-width: 34rem; padding: 0 2rem; text-align: center; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .75rem; }
    p { line-height: 1.8; color: var(--soft); margin: .4rem 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>打不开网站，也没有离线副本</h1>
    <p>网络当前访问不到站点，而这个桌面版里没有随包附带的离线副本。</p>
    <p>请检查网络连接，然后在「帮助」菜单里点「重新检查更新」。</p>
  </div>
</body>
</html>
